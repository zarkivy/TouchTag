<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物品库 · 触界</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/assets/favicon.svg">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site">
  <div class="site-inner">
    <a class="brand" href="/"><span class="brand-mark">TouchTag</span>触界</a>
    <nav class="site-nav" aria-label="工作台导航">
      <a href="/items">物品管理</a>
      <a href="/create">新增物品</a>
    </nav>
  </div>
</header>

<main id="main" tabindex="-1" class="wrap">
  <h1>物品库</h1>
  <p class="lead">一件物品一枚标签，标签外形由 AI 按该物品的轮廓生成。点开任意一件，可用摸、碰、看三层方式获取信息；卡片上画有该标签的外形示意，并提供 3D 打印文件下载。</p>

  <form class="card" id="filterForm" role="search">
    <div class="field-row">
      <div class="field" style="margin-bottom:0">
        <label for="q">搜索物品</label>
        <input type="search" id="q" name="q" placeholder="名称、位置、型号，例如「微波炉」「衣柜」">
      </div>
      <div class="field" style="margin-bottom:0">
        <label for="category">类别</label>
        <select id="category" name="category">
          <option value="">全部类别</option>
        </select>
      </div>
    </div>
    <div class="btn-row" style="margin-top:18px">
      <button type="submit" class="btn btn-primary">筛选</button>
      <button type="button" class="btn" id="resetBtn">重置</button>
      <a class="btn" href="/create">新建物品</a>
    </div>
  </form>

  <p id="count" class="muted" role="status" aria-live="polite" style="margin-top:20px"></p>
  <div class="grid grid-2" id="list" aria-busy="true"><p class="muted">正在载入…</p></div>
</main>

<footer class="app">
  <p>触界 TouchTag · 让每一件物品开口说话</p>
</footer>

<script src="/assets/app.js"></script>
<script>
(async function () {
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  const form = document.getElementById('filterForm');
  const catSel = document.getElementById('category');
  let categories = [];
  let shapes = [];

  async function load() {
    const params = new URLSearchParams();
    if (form.q.value.trim()) params.set('q', form.q.value.trim());
    if (catSel.value) params.set('category', catSel.value);
    list.setAttribute('aria-busy', 'true');
    try {
      const r = await api('/api/items?' + params.toString());
      count.textContent = '共 ' + r.total + ' 件物品' + (catSel.value || form.q.value ? '（已筛选）' : '');
      list.setAttribute('aria-busy', 'false');
      if (!r.items.length) {
        list.innerHTML = '<p class="muted">没有匹配的物品。</p>';
        return;
      }
      list.innerHTML = r.items.map((it) => {
        // 外形由服务端解析随物品下发（tag_shape_view）：AI 照物品生成的轮廓，或内置外形。
        const shape = it.tag_shape_view || shapes.find((s) => s.id === it.tag_shape) || null;
        const mm = it.stl_placeholder_mm;
        // 这枚物品专属标签的示意图：外形轮廓 + NFC 双凸点。外形名、打印尺寸、摆放说明
        // 一并写进 svg 的 aria-label，界面上只留这枚图形。
        const figLabel = [
          `标签外形：${shape ? (shape.shape || shape.name) : it.tag_shape}`,
          mm ? `3D 打印件 ${mm.width_mm} × ${mm.height_mm} × ${mm.thickness_mm} 毫米` : '',
          it.tag && it.tag.placement_note ? `摆放：${it.tag.placement_note}` : '',
        ].filter(Boolean).join('，');
        const fig = tagPreviewSvg(shape, 'symbol symbol-card', it.id, figLabel);
        return `
        <article class="card item-card">
          ${it.photo_url ? `<img class="item-thumb" src="${it.photo_url}" alt="${escapeHtml(it.name)}的实拍照片" loading="lazy" onerror="this.remove()">` : ''}
          <div class="item-head">
            <h3><a href="/i/${it.id}">${escapeHtml(it.name)}</a></h3>
            ${fig ? `<span class="tag-mark">${fig}</span>` : ''}
          </div>
          <p class="meta">${[it.category, it.brand_model].filter(Boolean).map(escapeHtml).join(' · ')}</p>
          ${it.location ? `<p class="meta">位置：${escapeHtml(it.location)}</p>` : ''}
          <p>
            ${it.safety_level === 'high' ? '<span class="badge badge-high">高风险</span>' : ''}
            <span class="badge">${it.controls.length} 个控制件</span>
            <span class="badge">${it.actions.length} 条操作</span>
            ${it.tag && it.tag.verified ? '' : '<span class="badge badge-warn">标签待确认</span>'}
          </p>
          <div class="acts">
            <a class="btn btn-sm btn-primary" href="/i/${it.id}">打开</a>
            <a class="btn btn-sm" href="/edit/${it.id}">编辑</a>
            <a class="btn btn-sm" href="/bind/${it.id}">绑定标签</a>
            <a class="btn btn-sm" href="${escapeHtml(it.stl_url || `/api/items/${encodeURIComponent(it.id)}/stl`)}" download>下载 STL</a>
          </div>
        </article>`;
      }).join('');
    } catch (e) {
      list.innerHTML = '<p class="muted">载入失败：' + escapeHtml(e.message) + '</p>';
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); load(); });
  catSel.addEventListener('change', load);
  document.getElementById('resetBtn').addEventListener('click', () => {
    form.q.value = '';
    catSel.value = '';
    load();
    form.q.focus();
  });

  // 外形清单：卡片上的 SVG 示意图要用它。读不到就退化成只有文字，卡片其余部分照常。
  try {
    shapes = (await loadTactile()).shapes || [];
  } catch (e) {
    shapes = [];
  }

  try {
    const all = await api('/api/items');
    categories = [...new Set(all.items.map((i) => i.category))];
    catSel.innerHTML = '<option value="">全部类别</option>' +
      categories.map((c) => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '（' + all.items.filter((i) => i.category === c).length + '）</option>').join('');
  } catch (e) { /* 忽略：下面的 load() 会给出错误 */ }

  await load();

  // 从编辑页删除后跳回本页：说明删除结果，并清掉地址栏里的参数
  const goneName = new URLSearchParams(window.location.search).get('gone');
  if (goneName) {
    toast('已删除「' + goneName + '」。');
    history.replaceState(null, '', '/items');
  }
})();
</script>
</body>
</html>
