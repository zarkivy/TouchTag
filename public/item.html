<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物品 · 触界</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/assets/favicon.svg">
</head>
<body>

<main id="main" tabindex="-1" class="wrap wrap-item">

  <p class="note note-warn" id="offlineNote" hidden>
    现在连不上网络，下面显示的是上次保存在这台手机里的概要。摸得到的标签不受影响，照常可以用。
  </p>

  <!-- 上：左边是标签形状，右边是文字介绍 -->
  <section class="item-top">
    <div class="item-shape" id="tagShapeBox"></div>
    <div class="item-text">
      <h1 id="itemName">正在载入…</h1>
      <p class="item-meta" id="itemWhere"></p>
      <p class="item-intro" id="itemIntro"></p>
    </div>
  </section>

  <!-- 两个大按钮 -->
  <section class="item-actions" aria-label="主要操作">
    <button type="button" class="btn btn-primary btn-hero" id="againBtn" data-idle-label="重播">
      <span data-label>重播</span>
    </button>
    <button type="button" class="btn btn-outline btn-hero" id="dialogBtn">
      语音对话
    </button>
    <p class="stage" id="playStatus" role="status" aria-live="polite"></p>
  </section>

  <!-- 语音对话：默认收起，点上面的「语音对话」才展开 -->
  <section class="dialog" id="askPanel" hidden>
    <h2 class="sr-only">和这件物品对话</h2>
    <form class="ask-voice" id="askForm">
      <label class="sr-only" for="question">说一句你想问的</label>
      <span class="mic-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </span>
      <input type="text" id="question" autocomplete="off" enterkeyhint="send" autocapitalize="off" placeholder="按一下，开口问我">
      <button type="submit" class="sr-only" id="askBtn">提问</button>
    </form>
    <div class="chips" id="quickAsk"></div>
    <div class="chat" id="chatLog" aria-live="polite" aria-label="和这件物品的对话"></div>
  </section>

  <!-- 看一眼：小按钮，拍张照让 AI 说说此刻的样子 -->
  <section class="look" aria-label="看一眼">
    <button type="button" class="btn btn-mid btn-wide" id="lookBtn">
      <span data-label>看一眼 · 拍张照让 AI 说说现在</span>
    </button>
    <input type="file" id="lookInput" accept="image/*" capture="environment" hidden>
    <p class="stage" id="lookStatus" role="status" aria-live="polite"></p>
    <div id="lookResult" hidden>
      <div class="card card-flat look-result">
        <p id="lookSummary"></p>
        <ul id="lookDetails"></ul>
        <div class="btn-row">
          <button type="button" class="btn btn-sm" id="lookReplay">再听一遍</button>
          <button type="button" class="btn btn-sm" id="lookAgain">再看一张</button>
        </div>
      </div>
    </div>
  </section>

  <p class="family-link"><a id="editLink" href="/edit/0" class="muted">家人入口：编辑这件物品的信息</a></p>
</main>

<script src="/assets/app.js"></script>
<script>
(async function () {
  /* /i/:id 和 /ask/:id 都是这一页。idFromPath('i') 只认 /i/ 前缀，
   * 所以 /ask/:id 必须自己把短码取出来——否则这一页会静默退化成「打不开这个页面」，
   * 而且不报错：路上走的是 fail() 的早退分支，控制台一片干净。
   */
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const id =
    (['i', 'ask'].includes(pathParts[0]) && pathParts[1] ? pathParts[1].toUpperCase() : '') || idFromPath('i');
  const isAskEntry = /^\/ask\//.test(window.location.pathname); // PRD §6：/ask/:id 是提问入口

  const els = {
    name: document.getElementById('itemName'),
    where: document.getElementById('itemWhere'),
    intro: document.getElementById('itemIntro'),
    offlineNote: document.getElementById('offlineNote'),
    playStatus: document.getElementById('playStatus'),
    lookStatus: document.getElementById('lookStatus'),
    chat: document.getElementById('chatLog'),
    quickAsk: document.getElementById('quickAsk'),
    tagShapeBox: document.getElementById('tagShapeBox'),
    askPanel: document.getElementById('askPanel'),
  };
  const againBtn = document.getElementById('againBtn');
  const dialogBtn = document.getElementById('dialogBtn');

  let item = null;
  let offline = false;

  // ---- 离线退化：缓存最近物品概要，断网时仍能读到文字（PRD §9 离线退化）
  const CACHE_KEY = 'tt-recent-items';
  function cacheItem(it) {
    try {
      const all = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
      all[it.id] = { at: Date.now(), item: it };
      const keys = Object.keys(all).sort((a, b) => all[b].at - all[a].at).slice(0, 8);
      const trimmed = {};
      keys.forEach((k) => { trimmed[k] = all[k]; });
      localStorage.setItem(CACHE_KEY, JSON.stringify(trimmed));
    } catch (e) { /* 存储不可用就算了 */ }
  }
  function cachedItem(cid) {
    try {
      const all = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
      return all[cid] ? all[cid].item : null;
    } catch (e) { return null; }
  }

  function fail(msg) {
    els.name.textContent = '打不开这个页面';
    els.where.textContent = '';
    els.intro.textContent = msg;
  }

  if (!id) return fail('这个地址好像不完整。');
  try {
    item = await api('/api/items/' + id);
    cacheItem(item);
  } catch (e) {
    const c = cachedItem(id);
    if (!c) return fail(e.message);
    item = c;
    offline = true;
    els.offlineNote.hidden = false;
  }

  document.title = item.name + ' · 触界';
  document.getElementById('editLink').href = '/edit/' + item.id;
  els.name.textContent = item.name;
  /* 给盲人看的这一行只说「放在哪」。型号不显示也不念——那是家人录入时核对用的，
   * 对使用者来说「厨房台面靠窗那台微波炉」比「M1-L213B」有用得多。 */
  els.where.textContent = item.location ? '放在' + item.location : '';

  /* 实拍照片：放在介绍区下面。给家人和评委确认「就是这件东西」用；
   * 盲人不受影响（读屏只念一句 alt）。加载失败（比如断网）就整块拿掉，不留破图。 */
  if (item.photo_url) {
    const img = document.createElement('img');
    img.className = 'item-photo';
    img.src = item.photo_url;
    img.alt = item.name + '的实拍照片';
    img.loading = 'lazy';
    img.onerror = () => img.remove();
    document.querySelector('.item-top').after(img);
  }

  // ---- 播报文案：服务端统一生成（与预热缓存一致），离线时本地兜底（同样不含型号）
  const speechPack = item.speech || {
    intro:
      '这是' + item.name + '。' +
      (item.location ? '它放在' + item.location + '。' : '') +
      (item.summary || ''),
  };
  const introText = speechPack.intro;
  els.intro.textContent = introText;

  /* 进来自动播放。浏览器多半要求先有用户手势才出声，所以「自动播放没响」是常态、不是故障。
   * 但判定不能看按钮显示成什么状态——浏览器合成在没装语音包的环境里也会把状态置成「正在播报」，
   * 于是屏幕上会出现「按钮说在播、其实一片安静」。要看 Speaker.speaking：
   * 它同时检查服务器音频和浏览器合成，只有它是 false 才代表真的没有声音。
   */
  bindSpeakButton(againBtn, () => introText, null);
  againBtn.addEventListener('click', () => {
    els.playStatus.textContent = '';
  });
  function nudgeIfSilent() {
    if (Speaker.speaking) {
      againBtn.classList.remove('btn-pulse');
      return;
    }
    againBtn.classList.add('btn-pulse');
    els.playStatus.textContent = '没听到声音的话，按一下「重播」就能听到这件物品的介绍。';
  }
  setTimeout(() => {
    Speaker.speak(introText);
    setTimeout(nudgeIfSilent, 1500);
  }, 500);

  // ---- 左边那一枚：标签的外形（第一层「摸」）
  try {
    const { shapes } = await loadTactile();
    const shape = shapes.find((s) => s.id === item.tag_shape) || null;
    const svg = tagPreviewSvg(shape, 'symbol symbol-lg', item.id);
    els.tagShapeBox.innerHTML = svg;
    if (!svg) els.tagShapeBox.hidden = true; // 没有外形数据时，别在左边留一块空白
  } catch (e) {
    els.tagShapeBox.hidden = true;
  }

  // ---- 语音对话：默认收起，点按钮才展开，并把光标放进输入框（弹出键盘的听写键）
  let dialogOpened = false;
  function openDialog(focusInput) {
    if (!dialogOpened) {
      els.askPanel.hidden = false;
      dialogOpened = true;
    }
    if (focusInput) document.getElementById('question').focus();
  }
  dialogBtn.addEventListener('click', () => {
    Speaker.stop(); // 想说话就先别念了，两路声音会打架
    againBtn.classList.remove('btn-pulse');
    els.playStatus.textContent = '';
    openDialog(true);
  });

  // ---- 看一眼：摄像头 + AI 实时信息
  const lookBtn = document.getElementById('lookBtn');
  const lookInput = document.getElementById('lookInput');
  const lookResult = document.getElementById('lookResult');
  const LOOK_IDLE = '看一眼 · 拍张照让 AI 说说现在';
  let lookText = '';

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('读不出这张照片'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('这不是一张能识别的图片'));
        img.onload = () => {
          const max = 1280;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = String(reader.result);
      };
      reader.readAsDataURL(file);
    });
  }

  async function doLook(dataUrl) {
    const label = lookBtn.querySelector('[data-label]');
    lookBtn.disabled = true;
    if (label) label.textContent = 'AI 正在看…';
    els.lookStatus.textContent = '正在把照片交给 AI，请稍等几秒…';
    try {
      const r = await api('/api/items/' + item.id + '/look', { method: 'POST', body: { image: dataUrl } });
      if (r.ok) {
        const lines = [];
        if (r.matches_item === false) lines.push('提醒：照片里的东西好像不是这件物品。');
        lines.push(r.summary || '看完了，但没有更多可说的。');
        (r.details || []).forEach((d) => lines.push(d));
        lookText = lines.join('。').replace(/。。/g, '。');
        document.getElementById('lookSummary').innerHTML = '<strong>' + escapeHtml(r.summary || '') + '</strong>';
        document.getElementById('lookDetails').innerHTML = (r.details || [])
          .map((d) => '<li>' + escapeHtml(d) + '</li>')
          .join('');
        lookResult.hidden = false;
      } else {
        lookText = r.answer || 'AI 这次没能看成，可以再拍一张试试。';
        lookResult.hidden = true;
        toast(lookText, 'error');
      }
      els.lookStatus.textContent = lookText;
      Speaker.speak(lookText);
    } catch (e) {
      els.lookStatus.textContent = '看一眼失败了：' + e.message;
      toast('看一眼失败：' + e.message, 'error');
    } finally {
      lookBtn.disabled = false;
      if (label) label.textContent = LOOK_IDLE;
    }
  }

  lookBtn.addEventListener('click', () => lookInput.click());
  lookInput.addEventListener('change', async () => {
    const file = lookInput.files && lookInput.files[0];
    if (!file) return;
    try {
      const dataUrl = await compressImage(file);
      await doLook(dataUrl);
    } catch (e) {
      toast(e.message, 'error');
    } finally {
      lookInput.value = '';
    }
  });
  document.getElementById('lookReplay').addEventListener('click', () => lookText && Speaker.speak(lookText));
  document.getElementById('lookAgain').addEventListener('click', () => lookInput.click());

  // ---- 聊天：长回答只先念重点，想听全部再点按钮（PRD §7 短回答优先）
  function userBubble(text) {
    const div = document.createElement('div');
    div.className = 'bubble bubble-user';
    div.textContent = text;
    els.chat.appendChild(div);
  }

  function botBubble(text, brief, briefOnly, sourceNote, logId) {
    const div = document.createElement('div');
    div.className = 'bubble bubble-bot';
    const p = document.createElement('span');
    p.textContent = text;
    div.appendChild(p);

    const bar = document.createElement('span');
    bar.className = 'bubble-bar';

    if (briefOnly && brief && brief !== text) {
      const b1 = document.createElement('button');
      b1.type = 'button';
      b1.className = 'btn btn-sm btn-primary';
      b1.textContent = '只听重点';
      b1.addEventListener('click', () => Speaker.speak(brief));
      bar.appendChild(b1);
      const b2 = document.createElement('button');
      b2.type = 'button';
      b2.className = 'btn btn-sm';
      b2.textContent = '听完整回答';
      b2.addEventListener('click', () => Speaker.speak(text));
      bar.appendChild(b2);
    } else {
      const replay = document.createElement('button');
      replay.type = 'button';
      replay.className = 'btn btn-sm';
      replay.textContent = '再听一遍';
      replay.addEventListener('click', () => Speaker.speak(text));
      bar.appendChild(replay);
    }
    div.appendChild(bar);

    if (logId) {
      const src = document.createElement('span');
      src.className = 'src';
      src.textContent = sourceNote || '';
      div.appendChild(src);
      const fb = document.createElement('span');
      fb.className = 'bubble-fb';
      fb.innerHTML =
        '<button type="button" class="btn btn-sm" data-fb="up">有帮助</button>' +
        '<button type="button" class="btn btn-sm" data-fb="down">说得不对</button>';
      fb.querySelectorAll('[data-fb]').forEach((b) =>
        b.addEventListener('click', async () => {
          try {
            await api('/api/qa-logs/' + logId + '/feedback', { method: 'POST', body: { feedback: b.dataset.fb } });
            toast(b.dataset.fb === 'up' ? '谢谢你，已记下。' : '已记下，我们会尽快修正这条回答。');
          } catch (e) {
            toast(e.message, 'error');
          }
        })
      );
      div.appendChild(fb);
    }
    els.chat.appendChild(div);
  }

  let asking = false;

  async function doAsk(q) {
    if (!q) {
      openDialog(true);
      toast('先说一句你想问什么。', 'error');
      return;
    }
    if (asking) return;
    if (offline) {
      toast('现在没有网络，等连上以后再问。', 'error');
      return;
    }
    asking = true;
    userBubble(q);
    const think = document.createElement('p');
    think.className = 'chat-thinking';
    think.textContent = '我在想…';
    els.chat.appendChild(think);
    const btn = document.getElementById('askBtn');
    btn.disabled = true;
    btn.textContent = '想一下…';
    clearTimeout(askTimer);
    const qEl = document.getElementById('question');
    qEl.placeholder = '正在想…';
    try {
      const r = await api('/api/ask', { method: 'POST', body: { item_id: item.id, question: q } });
      think.remove();
      const srcNote =
        (r.answer_source === 'llm' ? '结合物品档案与大模型' : '只依据这件物品的档案回答') + ' · ' +
        (r.llm_error ? '大模型暂时不在，用了备用方式' : '回答有据可查');
      botBubble(r.answer, r.answer_brief, r.brief_only, srcNote, r.log_id);
      // 先播短答，完整内容留在屏幕上（长回答不硬塞进耳朵）
      Speaker.speak(r.brief_only && r.answer_brief ? r.answer_brief : r.answer);
      document.getElementById('question').value = '';
    } catch (e) {
      think.remove();
      botBubble('哎呀，出问题了：' + e.message, '', false, '', null);
    } finally {
      asking = false;
      btn.disabled = false;
      btn.textContent = '提问';
      document.getElementById('question').placeholder = '按一下，开口问我';
    }
  }

  document.getElementById('askForm').addEventListener('submit', (e) => {
    e.preventDefault();
    doAsk(document.getElementById('question').value.trim());
  });

  // 语音输入：点一下话筒框 → 键盘听写说话 → 停顿 2.5 秒自动发送
  const qInput = document.getElementById('question');
  let askTimer = null;
  qInput.addEventListener('input', function () {
    clearTimeout(askTimer);
    if (!qInput.value.trim() || asking) return;
    askTimer = setTimeout(function () {
      if (!asking && qInput.value.trim()) doAsk(qInput.value.trim());
    }, 2500);
  });

  /* 常见问句：常用操作、按键位置、安全提示都不再单独占页面，
   * 收成一句话的快捷入口，点一下就问、听答案。
   */
  const quickParts = item.actions
    .slice(0, 3)
    .map((a) => '<button type="button" class="chip" data-q="' + escapeHtml(a.action_name) + '怎么做">' + escapeHtml(a.action_name) + '</button>');
  if (item.controls.length) quickParts.push('<button type="button" class="chip" data-q="按钮在哪里">按钮在哪里</button>');
  if (item.safety_notes.length) quickParts.push('<button type="button" class="chip" data-q="要注意什么">要注意什么</button>');
  els.quickAsk.innerHTML = quickParts.join('');
  els.quickAsk.querySelectorAll('[data-q]').forEach((b) =>
    b.addEventListener('click', () => doAsk(b.dataset.q))
  );

  // /ask/:id 是专门的提问入口：进来就把对话面板打开、光标落到输入框
  if (isAskEntry) openDialog(true);
})();
</script>
</body>
</html>
