<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物品管理 · 触界</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/assets/favicon.svg">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site">
  <div class="site-inner">
    <a class="brand" href="/"><span class="brand-mark">TouchTag</span>触界<span class="sub">物品管理</span></a>
  </div>
</header>

<main id="main" tabindex="-1" class="wrap">
  <h1>物品管理</h1>
  <p class="lead">为物品录入信息并绑定标签，单件约需三分钟。标签的 3D 打印文件在物品库中逐件下载。</p>

  <nav class="btn-stack" aria-label="管理入口" style="margin:26px 0 10px">
    <a class="btn btn-big" href="/items">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      物品库
    </a>
    <a class="btn btn-big" href="/create">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      新增物品
    </a>
  </nav>
  <p class="small muted" style="margin:0 0 0">物品库：查看已录入的物品与标签打印文件。新增物品：拍照、录入并生成标签。</p>

  <div class="card card-flat" id="sysInfo" style="margin-top:26px"><p class="muted">正在读取…</p></div>
</main>

<footer class="app">
  <p>触界 TouchTag · 让每一件物品开口说话</p>
</footer>

<script src="/assets/app.js"></script>
<script>
(async function () {
  try {
    const [stats, health] = await Promise.all([api('/api/stats'), api('/api/health')]);
    document.getElementById('sysInfo').innerHTML =
      '<table><caption class="sr-only">系统概况</caption><tbody>' +
      '<tr><th scope="row">物品档案</th><td>' + stats.items + ' 件</td></tr>' +
      '<tr><th scope="row">触觉标签</th><td>' + stats.tags + ' 枚，一物一签（已回读确认 ' + stats.tags_verified + ' 枚）</td></tr>' +
      '<tr><th scope="row">控制件 / 操作</th><td>' + stats.controls + ' 个 / ' + stats.actions + ' 条</td></tr>' +
      '<tr><th scope="row">问答引擎</th><td>' + escapeHtml(health.engine && health.engine.engine ? health.engine.engine : '') + (health.tts && health.tts.enabled ? ' · 神经网络语音已开启' : ' · 语音使用浏览器合成') + '</td></tr>' +
      '</tbody></table>';
  } catch (e) {
    document.getElementById('sysInfo').innerHTML = '<p class="muted">' + escapeHtml(e.message) + '</p>';
  }
})();
</script>
</body>
</html>
