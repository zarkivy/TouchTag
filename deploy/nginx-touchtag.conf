# TouchTag / 触界 —— nginx 反向代理
# 放置到 /etc/nginx/sites-available/touchtag，软链到 sites-enabled/
# 一键部署：bash TouchTag/deploy/deploy.sh
#
# 证书路径固定为 /etc/ssl/touchtag/：
#   - 先放自签证书，保证服务立刻可用
#   - 拿到正式证书后，用 deploy/install-cert.sh 覆盖这两个文件即可，本配置不用改
#
# 说明：本机位于中国大陆，域名未备案时运营商会对 Host 头做拦截，
# 因此这里不做 http→https 强制跳转，两个端口都直接提供应用，保留 IP 访问作为回退路径。

upstream touchtag_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cerr.cc _;

    # 拍照录入要上传压缩后的照片（base64 后约 1–4MB）
    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 语音：关掉缓冲，让浏览器边下边播（PRD F04 打开到可听 ≤3 秒）
    location /api/tts {
        proxy_pass http://touchtag_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://touchtag_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # 大模型问答、语音预热都是长请求，不能按默认 60 秒掐断
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name cerr.cc _;

    ssl_certificate     /etc/ssl/touchtag/fullchain.pem;
    ssl_certificate_key /etc/ssl/touchtag/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/css text/javascript application/json image/svg+xml;

    location /api/tts {
        proxy_pass http://touchtag_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://touchtag_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
